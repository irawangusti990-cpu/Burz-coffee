<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BURZ COFFEE: Kasir, Stempel, Katering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EFE8;--card:#fff;--ink:#3A320C;--mut:#7a7048;--line:#ddd8c6;--gold:#AE832F;--btn:#3A320C;--btnt:#F1EFE8;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#26200a;--card:#3A320C;--ink:#E9E8E3;--mut:#b8ad85;--line:#52481b;--gold:#d3a549;--btn:#d3a549;--btnt:#26200a}}
:root[data-theme="dark"]{--bg:#26200a;--card:#3A320C;--ink:#E9E8E3;--mut:#b8ad85;--line:#52481b;--gold:#d3a549;--btn:#d3a549;--btnt:#26200a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.hd{background:#3A320C;display:flex;justify-content:center;padding:14px 0 10px}
.hd img{height:96px;width:auto;display:block}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.tabs{display:flex;gap:6px;overflow-x:auto;background:var(--card);padding:5px;border-radius:14px;border:1px solid var(--line);margin-bottom:14px}
.tabs button{flex:none;border:0;background:none;color:var(--mut);font:600 15px inherit;font-family:inherit;padding:10px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--btn);color:var(--btnt)}
button,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:15px}
.m span{color:var(--gold);font-weight:800;font-size:14px}
.m:active{transform:scale(.97)}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.line .n{flex:1}.line .n small{display:block;color:var(--mut)}
.q{display:flex;align-items:center;gap:8px}
.q button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
input,select,textarea{display:block;width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
label{display:block;font-size:13px;color:var(--mut);margin:2px 0 3px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:13px;font:800 16px inherit;font-family:inherit;background:var(--btn);color:var(--btnt);cursor:pointer}
.btn.s{display:inline-block;width:auto;padding:9px 14px;font-size:14px;font-weight:600}
.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}
.btn[disabled],.btn.off{opacity:.35;cursor:not-allowed}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:20px;margin:12px 0}
.info{font-size:14px;color:var(--mut);margin:0 0 8px}.info b{color:var(--ink)}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 12px}
.st{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--mut);text-align:center;line-height:1.1}
.st.on{border:3px solid var(--gold);color:var(--gold);font-size:20px;transform:rotate(var(--r));box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--gold)}
.st.g{border-style:solid;border-color:var(--gold);color:var(--gold);font-weight:800}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.head b{font-size:17px}.head span{color:var(--mut);font-size:14px}
.badge{display:inline-block;background:var(--gold);color:#26200a;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;margin:4px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--mut);text-align:center;padding:20px 8px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.sum b{display:block;font-size:20px}.sum span{color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.cust)S={cust:[],trx:[],sar:[],cat:[],
 tpl:['Hai {nama}, mau ngopi hari ini? BURZ COFFEE tunggu kamu ya!','Hai {nama}, sudah lama nih kamu nggak isi stempel. Keburu di-reset lho, yuk mampir!'],
 set:{ig:'',tt:'',wa:'',gm:'',ben:'Manfaat pelanggan setia sedang disiapkan.'}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let tab='kasir',cart={},ph='',nm='',q='',tg='all',draft=S.tpl[0],tt;
const setia=c=>c.t>=1||c.s>=GOAL;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)};
const val=id=>($('#'+id)||{value:''}).value.trim();

function cinfo(){
 const c=ph&&S.cust.find(x=>x.h===ph);let h='';
 if(c){nm=c.n;$('#nm').value=c.n}
 if(c)h=`<p class="info">Pelanggan: <b>${esc(c.n)}</b>, stempel ${Math.min(c.s,GOAL)}/${GOAL}. Tiap gelas dapat 1 stempel.${setia(c)?'<br><span class="badge">Pelanggan setia</span>':''}</p>`;
 else if(ph.length>=8)h=`<p class="info">Nomor baru. Nama wajib diisi untuk mendaftarkan pelanggan.</p>`;
 $('#cinfo').innerHTML=h;
}
function kasir(){
 const ids=Object.keys(cart).filter(i=>cart[i]>0);
 const total=ids.reduce((a,i)=>a+cart[i]*MENU.find(m=>m.id==i).p,0),cups=ids.reduce((a,i)=>a+cart[i],0);
 $('#view').innerHTML=`<div class="card"><h2>Menu</h2><div class="grid">${MENU.map(m=>`<button class="m" data-a="add" data-id="${m.id}"><b>${m.n}</b><span>${rp(m.p)}</span></button>`).join('')}</div></div>
 <div class="card"><h2>Pesanan</h2>${ids.length?ids.map(i=>{const m=MENU.find(x=>x.id==i);return `<div class="line"><div class="n">${m.n}<small>${rp(m.p)}</small></div><div class="q"><button data-a="dec" data-id="${i}" aria-label="Kurangi">−</button><b>${cart[i]}</b><button data-a="add" data-id="${i}" aria-label="Tambah">+</button></div></div>`}).join(''):'<div class="empty">Ketuk menu di atas untuk mulai.</div>'}
 <div class="total"><span>Total</span><span>${rp(total)}</span></div>
 <input id="nm" placeholder="Nama pelanggan (opsional)" value="${esc(nm)}" autocomplete="off">
 <input id="ph" type="tel" inputmode="numeric" placeholder="No. HP pelanggan (opsional, untuk stempel)" value="${esc(ph)}" autocomplete="off">
 <div id="cinfo"></div><button class="btn" data-a="pay">Bayar${cups?` (${cups} gelas)`:''}</button></div>`;
 cinfo();
}
function stamps(c){const on=Math.min(c.s,GOAL);let h='';
 for(let i=0;i<GOAL;i++){const r=((i*37)%15)-7;
  h+=i<on?`<div class="st on" style="--r:${r}deg">☕</div>`:i===GOAL-1?'<div class="st g">Gratis</div>':`<div class="st">${i+1}</div>`}
 return h}
function stempel(){$('#view').innerHTML=`<input id="q" type="search" placeholder="Cari nama atau no. HP" value="${esc(q)}" autocomplete="off"><div id="list"></div>`;clist()}
function clist(){
 const f=S.cust.filter(c=>(c.n+' '+c.h).toLowerCase().includes(q.toLowerCase()));
 $('#list').innerHTML=f.length?f.map(c=>`<div class="card"><div class="head"><b>${esc(c.n)}</b><span>${esc(c.h)}</span></div>
 ${setia(c)?`<span class="badge">Pelanggan setia</span><p class="info">${esc(S.set.ben)}</p>`:''}
 <div class="stamps">${stamps(c)}</div><p class="info">${c.s} stempel${c.s>GOAL?` (${c.s-GOAL} kelebihan tetap tersimpan)`:''}. Sudah ditukar ${c.t}x.</p>
 <div class="acts"><button class="btn s o" data-a="plus" data-id="${c.id}">+1 stempel</button><button class="btn s" data-a="redeem" data-id="${c.id}" ${c.s>=GOAL?'':'disabled'}>Tukar gratis</button></div></div>`).join(''):
 `<div class="empty">${S.cust.length?'Tidak ada yang cocok.':'Belum ada pelanggan. Isi no. HP di tab Kasir saat transaksi untuk mendaftarkan.'}</div>`;
}
function notif(){
 $('#view').innerHTML=`<div class="card"><h2>Tulis pesan</h2><p class="info">Tulis {nama} supaya otomatis diganti nama pelanggan. Pesan dikirim lewat WhatsApp, satu pelanggan sekali ketuk.</p>
 <textarea id="msg" rows="4">${esc(draft)}</textarea>
 <div class="chips">${S.tpl.map((t,i)=>`<button class="chip" data-a="tpl" data-id="${i}">${esc(t.slice(0,26))}…</button>`).join('')}</div>
 <button class="btn s o" data-a="savetpl">Simpan jadi template</button></div>
 <div class="card"><h2>Kirim ke</h2><select id="tg"><option value="all">Semua pelanggan</option><option value="lama">Sudah lama nggak datang (14 hari+)</option><option value="setia">Pelanggan setia</option></select><div id="nl"></div></div>`;
 $('#tg').value=tg;nlist();
}
function nlist(){
 const now=Date.now();
 const f=S.cust.filter(c=>tg==='all'||(tg==='setia'?setia(c):!c.last||now-c.last>14*DAY));
 $('#nl').innerHTML=f.length?f.map(c=>{const m=draft.split('{nama}').join(c.n);
  return `<div class="line"><div class="n">${esc(c.n)}<small>${c.last?'Terakhir '+fmt(c.last):'Belum pernah beli'}</small></div><a class="btn s" target="_blank" rel="noopener" href="https://wa.me/${waNum(c.h)}?text=${encodeURIComponent(m)}">Kirim WA</a></div>`}).join(''):'<div class="empty">Belum ada pelanggan di kelompok ini.</div>';
}
function katering(){
 $('#view').innerHTML=`<div class="card"><h2>Pesanan katering</h2><p class="info">Untuk pernikahan, arisan keluarga, ulang tahun, kantor, dan acara lain.</p>
 <label>Nama pemesan</label><input id="kn"><label>No. HP</label><input id="kh" type="tel" inputmode="numeric">
 <label>Jenis acara</label><select id="ke"><option>Pernikahan</option><option>Arisan keluarga</option><option>Ulang tahun</option><option>Kantor / rapat</option><option>Lainnya</option></select>
 <label>Tanggal acara</label><input id="kd" type="date"><label>Menu</label><select id="km"><option value="17000">Kopi susu gula aren (Rp 17.000)</option><option value="15000">Kopi susu (Rp 15.000)</option></select>
 <label>Jumlah gelas</label><input id="kq" type="number" inputmode="numeric" min="1"><label>Catatan</label><textarea id="kc" rows="2" placeholder="Alamat, jam, permintaan khusus"></textarea>
 <button class="btn" data-a="savecat">Simpan pesanan</button></div>
 ${S.cat.length?S.cat.map(o=>`<div class="card"><div class="head"><b>${esc(o.e)}: ${esc(o.n)}</b><span>${o.done?'Selesai':'Baru'}</span></div>
 <p class="info">${esc(o.d||'Tanggal belum diisi')}, ${o.q} gelas, perkiraan ${rp(o.q*o.p)} (harga normal)${o.c?'<br>'+esc(o.c):''}</p>
 <div class="acts"><a class="btn s o" target="_blank" rel="noopener" href="https://wa.me/${waNum(o.h)}">Chat WA</a><button class="btn s o" data-a="catdone" data-id="${o.id}">${o.done?'Buka lagi':'Tandai selesai'}</button></div></div>`).join(''):''}`;
}
function ulasan(){
 const L=[['Instagram',url(S.set.ig)],['TikTok',url(S.set.tt)],['WhatsApp',digits(S.set.wa)?'https://wa.me/'+waNum(S.set.wa):''],['Google Maps',url(S.set.gm)]];
 $('#view').innerHTML=`<div class="card"><h2>Beri ulasan atau ikuti kami</h2><div class="links">${L.map(([n,u])=>u?`<a class="btn" target="_blank" rel="noopener" href="${esc(u)}">${n}</a>`:`<span class="btn off">${n}</span>`).join('')}</div>
 ${L.some(x=>!x[1])?'<p class="info" style="margin-top:8px">Tombol yang redup belum punya link. Isi di Pengaturan di bawah.</p>':''}</div>
 <div class="card"><h2>Kritik dan saran</h2><label>Nama (boleh dikosongkan)</label><input id="sn"><label>Tulis di sini</label><textarea id="st" rows="3"></textarea><button class="btn" data-a="savesar">Kirim</button></div>
 ${S.sar.length?`<div class="card"><h2>Masukan masuk</h2>${S.sar.map(s=>`<div class="line"><div class="n">${esc(s.t)}<small>${esc(s.n||'Anonim')}, ${fmt(s.at)}</small></div></div>`).join('')}</div>`:''}
 <div class="card"><h2>Pengaturan (untuk pemilik)</h2>
 <label>Link Instagram (https://...)</label><input id="s_ig" value="${esc(S.set.ig)}"><label>Link TikTok (https://...)</label><input id="s_tt" value="${esc(S.set.tt)}">
 <label>No. WhatsApp BURZ COFFEE</label><input id="s_wa" type="tel" value="${esc(S.set.wa)}"><label>Link Google Maps (https://...)</label><input id="s_gm" value="${esc(S.set.gm)}">
 <label>Manfaat pelanggan setia</label><textarea id="s_ben" rows="2">${esc(S.set.ben)}</textarea><button class="btn o" data-a="saveset">Simpan pengaturan</button></div>`;
}
function riwayat(){
 const day=new Date().toDateString(),td=S.trx.filter(t=>new Date(t.at).toDateString()===day),sum=td.reduce((a,t)=>a+t.total,0);
 $('#view').innerHTML=`<div class="sum"><div><b>${rp(sum)}</b><span>Hari ini</span></div><div><b>${td.length}</b><span>Transaksi hari ini</span></div></div>
 ${S.trx.length?S.trx.slice(0,60).map(t=>`<div class="card"><div class="head"><b>${rp(t.total)}</b><span>${fmt(t.at)}</span></div><p class="info">${t.items.map(i=>esc(i.n)+' ×'+i.q).join(', ')}${t.c?`<br>Pelanggan: <b>${esc(t.c)}</b>`:''}</p></div>`).join(''):'<div class="empty">Belum ada transaksi.</div>'}`;
}
function render(){$('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-a="tab" data-k="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');({kasir,stempel,notif,katering,ulasan,riwayat})[tab]()}
function pay(){
 const ids=Object.keys(cart).filter(i=>cart[i]>0);if(!ids.length)return toast('Pesanan masih kosong');
 const items=ids.map(i=>{const m=MENU.find(x=>x.id==i);return{n:m.n,p:m.p,q:cart[i]}});
 const total=items.reduce((a,i)=>a+i.p*i.q,0),cups=items.reduce((a,i)=>a+i.q,0);
 let c=ph&&S.cust.find(x=>x.h===ph);
 if(ph&&!c){if(ph.length<8)return toast('No. HP terlalu pendek. Cek lagi atau kosongkan.');
  if(!nm.trim())return toast('Isi nama pelanggan baru, atau kosongkan no. HP.');
  c={id:Date.now(),n:nm.trim(),h:ph,s:0,t:0,last:0};S.cust.push(c)}
 if(c){c.s+=cups;c.last=Date.now()}
 S.trx.unshift({id:Date.now(),at:Date.now(),items,total,c:c?c.n:nm.trim()});save();
 toast(c?`Dibayar ${rp(total)}. ${c.n} dapat +${cups} stempel.`:`Dibayar ${rp(total)}.`);cart={};ph='';nm='';render();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 if(a==='tab'){tab=b.dataset.k;render()}
 else if(a==='add'){cart[id]=(cart[id]||0)+1;render()}
 else if(a==='dec'){cart[id]=Math.max(0,(cart[id]||0)-1);render()}
 else if(a==='pay')pay();
 else if(a==='plus'||a==='redeem'){const c=S.cust.find(x=>x.id==id);if(!c)return;
  if(a==='plus'){c.s++;c.last=Date.now();toast(`+1 stempel untuk ${c.n}.`)}
  else if(c.s>=GOAL){c.s-=GOAL;c.t++;toast(`${c.n} menukar 1 kopi gratis.`)}
  save();render()}
 else if(a==='tpl'){draft=S.tpl[id];$('#msg').value=draft;nlist()}
 else if(a==='savetpl'){if(draft.trim()&&!S.tpl.includes(draft)){S.tpl.push(draft);save();toast('Template tersimpan.');render()}}
 else if(a==='savecat'){const n=val('kn'),h=val('kh'),qn=parseInt(val('kq'),10);
  if(!n||digits(h).length<8||!(qn>0))return toast('Isi nama, no. HP, dan jumlah gelas.');
  S.cat.unshift({id:Date.now(),n,h,e:val('ke'),d:val('kd'),p:parseInt(val('km'),10),q:qn,c:val('kc'),done:false});save();toast('Pesanan katering disimpan.');render()}
 else if(a==='catdone'){const o=S.cat.find(x=>x.id==id);o.done=!o.done;save();render()}
 else if(a==='savesar'){const t=val('st');if(!t)return toast('Tulis dulu kritik atau sarannya.');
  S.sar.unshift({at:Date.now(),n:val('sn'),t});save();toast('Terima kasih atas masukannya!');render()}
 else if(a==='saveset'){S.set={ig:val('s_ig'),tt:val('s_tt'),wa:val('s_wa'),gm:val('s_gm'),ben:val('s_ben')||S.set.ben};save();toast('Pengaturan disimpan.');render()}
});
document.addEventListener('input',e=>{const i=e.target.id;
 if(i==='ph'){ph=digits(e.target.value);cinfo()}else if(i==='nm')nm=e.target.value;
 else if(i==='q'){q=e.target.value;clist()}else if(i==='msg'){draft=e.target.value;nlist()}
});
document.addEventListener('change',e=>{if(e.target.id==='tg'){tg=e.target.value;nlist()}});
render();
</script>
</body>
</html>
